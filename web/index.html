<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МойБот</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="МойБот">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e7e9ee; --dim:#9aa3b2; --accent:#7c5cff; --accent2:#00d3a7; --bot:#20252f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
       font-family:"Segoe UI",system-ui,Arial,sans-serif}

  /* ——— Сайдбар с историей ——— */
  .sidebar{width:260px;flex-shrink:0;background:#12151b;border-right:1px solid var(--line);
           display:flex;flex-direction:column;transition:transform .2s;z-index:40}
  .sidebar .top{padding:12px}
  .newchat{width:100%;padding:12px;border-radius:12px;background:var(--accent);color:#fff;
           font-weight:600;font-size:15px;cursor:pointer;border:none}
  .chatlist{flex:1;overflow-y:auto;padding:6px}
  .chatitem{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:10px;
            cursor:pointer;color:var(--dim);font-size:14px}
  .chatitem:hover{background:var(--panel2);color:var(--text)}
  .chatitem.active{background:var(--panel2);color:#fff}
  .chatitem .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chatitem .del{opacity:.5;font-size:13px}
  .chatitem .del:hover{opacity:1;color:#e74c3c}

  /* ——— Основная область ——— */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .burger{display:none;font-size:22px;cursor:pointer;background:none;border:none;color:var(--text)}
  header .logo{font-weight:700;font-size:17px}
  header .logo span{color:var(--accent)}
  header .sp{margin-left:auto;display:flex;gap:8px}
  header .sp button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
                    border-radius:10px;padding:8px 12px;font-size:16px;cursor:pointer}
  header .sp button.active{border-color:var(--accent2);color:#fff}
  .status{color:var(--dim);font-size:12px;padding:0 16px}

  .msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:720px;padding:12px 15px;border-radius:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:#2a2f3a;border:1px solid var(--line)}
  .msg.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line)}
  .who{font-size:11px;color:var(--dim);margin-bottom:3px}
  .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:11px;background:#2b3242;color:#cdd4e0;border:1px solid var(--line);padding:3px 9px;border-radius:999px}

  .inputbar{display:flex;gap:8px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
            border-top:1px solid var(--line);background:var(--panel);flex-shrink:0}
  .mic{width:46px;background:var(--panel2);border:1px solid var(--line);font-size:20px;border-radius:12px;cursor:pointer;color:var(--text)}
  .mic.on{background:#c0392b;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.5}}
  textarea{flex:1;resize:none;height:46px;max-height:150px;padding:12px 14px;border-radius:12px;
           border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px;font-family:inherit}
  .send{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:0 20px;font-size:18px;cursor:pointer}

  /* ——— Оверлей экрана (работает и на телефоне) ——— */
  .screenModal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;
               flex-direction:column;padding:10px}
  .screenModal.show{display:flex}
  .screenModal .bar{display:flex;align-items:center;gap:10px;color:#fff;padding:6px}
  .screenModal .bar b{flex:1}
  .screenModal .close{background:#2a2f3a;border:none;color:#fff;border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer}
  .screenModal img{flex:1;width:100%;object-fit:contain;border-radius:10px}

  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none}
  .backdrop.show{display:block}

  @media(max-width:820px){
    .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%)}
    .sidebar.open{transform:translateX(0)}
    header .burger{display:block}
  }
</style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="top"><button class="newchat" id="newchat">＋ Новый чат</button></div>
    <div class="chatlist" id="chatlist"></div>
  </div>
  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <header>
      <button class="burger" id="burger">☰</button>
      <div class="logo">Мой<span>Бот</span> 🤖</div>
      <div class="sp">
        <button id="screenBtn" title="Смотреть экран ПК">👁</button>
        <button id="speakBtn" class="active" title="Озвучка">🔊</button>
      </div>
    </header>
    <div class="status" id="status">готов</div>
    <div class="msgs" id="msgs"></div>
    <div class="inputbar">
      <button class="mic" id="mic" title="Говорить">🎤</button>
      <textarea id="inp" placeholder="Напиши или скажи, что сделать…"></textarea>
      <button class="send" id="send">➤</button>
    </div>
  </div>

  <!-- Полноэкранный просмотр экрана ПК -->
  <div class="screenModal" id="screenModal">
    <div class="bar">
      <b>👁 Экран</b>
      <span id="monBtns" style="display:flex;gap:6px"></span>
      <span style="flex:1"></span>
      <button class="close" id="screenClose">Закрыть</button>
    </div>
    <div style="flex:1;overflow:auto;-webkit-overflow-scrolling:touch">
      <img id="screenImg" alt="экран" style="display:block;width:100%;height:auto">
    </div>
    <div style="color:#9aa3b2;font-size:12px;text-align:center;padding:4px">
      💡 два пальца — увеличить/уменьшить
    </div>
  </div>

<script>
const msgs=document.getElementById('msgs'), inp=document.getElementById('inp'),
      statusEl=document.getElementById('status'), chatlist=document.getElementById('chatlist');
let speak=true;

function add(role,text,actions){
  const d=document.createElement('div'); d.className='msg '+role;
  const w=document.createElement('div'); w.className='who'; w.textContent=role==='user'?'Ты':'Бот'; d.appendChild(w);
  const b=document.createElement('div'); b.textContent=text; d.appendChild(b);
  if(actions&&actions.length){const a=document.createElement('div');a.className='actions';
    actions.forEach(x=>{const c=document.createElement('span');c.className='chip';c.textContent='⚙ '+x;a.appendChild(c);});d.appendChild(a);}
  msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
}
function clearMsgs(){msgs.innerHTML='';}

async function loadChats(){
  const r=await fetch('/api/chats'); const j=await r.json();
  renderChats(j.chats, j.current);
  clearMsgs(); (j.messages||[]).forEach(m=>add(m.role,m.content));
  if(!j.messages || !j.messages.length) add('bot','Привет, босс! Скажи или напиши, что сделать.');
}
function renderChats(list,cur){
  chatlist.innerHTML='';
  list.forEach(c=>{
    const it=document.createElement('div'); it.className='chatitem'+(c.id===cur?' active':'');
    const t=document.createElement('div'); t.className='t'; t.textContent=c.title||'Чат'; it.appendChild(t);
    const del=document.createElement('div'); del.className='del'; del.textContent='🗑';
    del.onclick=async(e)=>{e.stopPropagation(); await fetch('/api/chats/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id})}); loadChats();};
    it.appendChild(del);
    it.onclick=async()=>{const r=await fetch('/api/chats/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id})});
      const j=await r.json(); clearMsgs(); (j.messages||[]).forEach(m=>add(m.role,m.content)); closeSidebar(); loadChats.cur=c.id; markActive(c.id);};
    chatlist.appendChild(it);
  });
}
function markActive(id){[...chatlist.children].forEach(ch=>ch.classList.remove('active'));}

document.getElementById('newchat').onclick=async()=>{await fetch('/api/chats/new',{method:'POST'}); await loadChats(); closeSidebar();};

async function send(){
  const text=inp.value.trim(); if(!text) return;
  try{ speechSynthesis.cancel(); }catch(e){}   // перестать читать прошлый ответ
  inp.value=''; add('user',text); statusEl.textContent='думаю…';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const j=await r.json(); add('bot',j.reply,j.actions); if(speak) say(j.reply);
    loadChatsTitlesOnly();
  }catch(e){add('bot','Ошибка связи: '+e);}
  statusEl.textContent='готов';
}
async function loadChatsTitlesOnly(){const r=await fetch('/api/chats');const j=await r.json();renderChats(j.chats,j.current);}

document.getElementById('send').onclick=send;
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

// озвучка
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.slice(0,600));u.lang='ru-RU';speechSynthesis.speak(u);}catch(e){}}
document.getElementById('speakBtn').onclick=function(){speak=!speak;this.classList.toggle('active',speak);this.textContent=speak?'🔊':'🔇';if(!speak)speechSynthesis.cancel();};

// голосовой ввод
const mic=document.getElementById('mic'); let rec=null,listening=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){rec=new SR();rec.lang='ru-RU';rec.interimResults=false;
  rec.onresult=e=>{inp.value=e.results[0][0].transcript;send();};
  rec.onend=()=>{listening=false;mic.classList.remove('on');};
  rec.onerror=()=>{listening=false;mic.classList.remove('on');};
  mic.onclick=()=>{if(listening){rec.stop();return;}try{rec.start();listening=true;mic.classList.add('on');statusEl.textContent='слушаю…';}catch(e){}};
}else{mic.onclick=()=>alert('Голосовой ввод — в Chrome.');}

// экран ПК (оверлей, работает и на телефоне) — по мониторам
const modal=document.getElementById('screenModal'), screenImg=document.getElementById('screenImg'),
      monBtns=document.getElementById('monBtns');
let screenTimer=null, currentMon=1;
function refreshScreen(){ screenImg.src='/api/screen?mon='+currentMon+'&t='+Date.now(); }
async function buildMonButtons(){
  let count=1;
  try{ count=(await (await fetch('/api/monitors')).json()).count||1; }catch(e){}
  monBtns.innerHTML='';
  if(count<=1) return;
  for(let i=1;i<=count;i++){
    const b=document.createElement('button');
    b.textContent='Экран '+i;
    b.style.cssText='background:#2a2f3a;border:1px solid '+(i===currentMon?'#00d3a7':'#3a4150')+
                    ';color:#fff;border-radius:8px;padding:6px 12px;font-size:14px';
    b.onclick=()=>{currentMon=i;[...monBtns.children].forEach(c=>c.style.borderColor='#3a4150');
                   b.style.borderColor='#00d3a7';refreshScreen();};
    monBtns.appendChild(b);
  }
}
document.getElementById('screenBtn').onclick=async()=>{
  modal.classList.add('show');
  await buildMonButtons();
  refreshScreen();
  screenTimer=setInterval(refreshScreen,1200);
};
document.getElementById('screenClose').onclick=()=>{modal.classList.remove('show');clearInterval(screenTimer);};

// сайдбар на телефоне
const sidebar=document.getElementById('sidebar'), backdrop=document.getElementById('backdrop');
function closeSidebar(){sidebar.classList.remove('open');backdrop.classList.remove('show');}
document.getElementById('burger').onclick=()=>{sidebar.classList.toggle('open');backdrop.classList.toggle('show');};
backdrop.onclick=closeSidebar;

loadChats();
</script>
</body>
</html>
